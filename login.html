<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
            <link rel="stylesheet" href="style.css">
            <style>
                    .inputBx input {
                        border: 2px solid #111 !important;
                        background: transparent;
                        color: #fff;
                        border-radius: 6px;
                        box-shadow: 0 0 8px #01dbc2, 0 0 2px #111;
                        transition: border-color 0.2s, box-shadow 0.2s;
                    }
                    .inputBx input:focus {
                        border-color: #01dbc2 !important;
                        box-shadow: 0 0 16px #01dbc2, 0 0 2px #111;
                    }
            </style>
            <style>
                .remember-label {
                    color: #111;
                    transition: text-shadow 0.3s, color 0.3s;
                }
                .remember-label:hover {
                    text-shadow: 0 0 8px #01dbc2, 0 0 16px #01dbc2;
                    color: #01dbc2;
                }
            </style>
</head>
<body>
    <div class="box">
        <form>
            <h2>Login</h2>
            <div class="inputBx">
                <input type="text" placeholder="Username" required>
            </div>
            <div class="inputBx">
                <input type="password" placeholder="Password" required>
            </div>
                    <div class="inputBx" style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
                    <input type="checkbox" id="remember" style="accent-color:#01dbc2;width:20px;height:20px;box-shadow:0 0 0 2px #01dbc2;">
            <label for="remember" class="remember-label" style="cursor:pointer;font-size:1em;user-select:none;letter-spacing:0.05em;">Remember me</label>
                    </div>
            <div class="inputBx">
                <input type="submit" value="Login">
            </div>
            <div class="group">
                <a href="idk.html">Back to Signup</a>
            </div>
        </form>
    </div>
</body>
</html>
